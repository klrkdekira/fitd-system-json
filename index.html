  pre { background: var(--code-bg); border: 1px solid var(--border); padding: 1.1rem; border-radius: 4px; overflow-x: auto; font: .8rem/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
  .placeholder { color: var(--muted); padding: .65rem 1rem; }
  /* landing */
  .landing { max-width: 68rem; margin: 0 auto; }
  .landing::before { content: "OPEN REFERENCE CORPUS"; display: block; color: var(--brass); font-size: .72rem; font-weight: 850; letter-spacing: .18em; margin-bottom: .72rem; }
  .landing.collection-intro::before { content: "COLLECTION"; }
  .landing h2 { max-width: 52rem; font-size: clamp(2.25rem, 4vw, 3.3rem); line-height: 1.08; margin: 0 0 1.2rem; }
  .landing h2::after {
    content: ""; display: block; width: 7.5rem; height: 3px; margin-top: 1.1rem;
    background: linear-gradient(90deg, var(--accent), var(--brass));
  }
  .landing .lede { color: var(--muted); max-width: 48rem; margin: 0; font-size: clamp(1.05rem, 1.55vw, 1.18rem); line-height: 1.76; text-wrap: pretty; }
  .landing-meta { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.3rem; }
  .landing-meta span {
    padding: .3rem .65rem; border: 1px solid var(--border); border-radius: 3px;
    background: var(--card); color: var(--muted); font-size: .73rem; font-weight: 700; letter-spacing: .025em;
  }
  .section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 1.25rem; margin: 3rem 0 .9rem; }
  .section-heading h3 { margin: 0; }
  .section-heading p { margin: 0; color: var(--muted); font-size: .8rem; text-align: right; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .78rem; margin: 2.25rem 0 2.75rem; }
  .section-heading + .cards { margin-top: 0; }
  .cards a {
    position: relative; min-height: 98px; background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--brass); border-radius: 4px;
    padding: 1rem 1.08rem 1.05rem; text-decoration: none; color: var(--text); box-shadow: var(--shadow);
    transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .cards a::after { content: "→"; position: absolute; right: 1rem; top: .95rem; color: var(--muted); opacity: .45; }
  .cards a:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .cards a:hover::after { color: var(--accent); }
  .cards .n { display: block; font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; line-height: 1.35; color: var(--accent); }
  .cards .l { color: var(--muted); font-size: .84rem; font-weight: 650; }
  .landing h3 { margin: 2rem 0 .7rem; font-family: var(--font-text); font-size: 1.4rem; font-weight: 700; }
  .resource-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; margin: .9rem 0 0; }
  .resource-group { min-width: 0; padding: 1.15rem 1.2rem 1rem; border: 1px solid var(--border); border-radius: 4px; background: var(--card); box-shadow: var(--shadow); }
  .resource-group h4 { margin: 0 0 .22rem; font-family: var(--font-text); font-size: 1.02rem; }
  .resource-group > p { margin: 0 0 .82rem; color: var(--muted); font-size: .79rem; line-height: 1.55; }
  .resource-list { padding: 0; margin: 0; list-style: none; }
  .resource-list li { border-top: 1px solid var(--border); }
  .resource-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .7rem; padding: .66rem 0; text-decoration: none; }
  .resource-link > span:first-child { min-width: 0; }
  .resource-link:hover .resource-name { text-decoration: underline; }
  .resource-name { display: block; font-size: .86rem; font-weight: 700; overflow-wrap: anywhere; }
  .resource-detail { display: block; color: var(--muted); font-size: .76rem; font-weight: 400; line-height: 1.48; }
  .resource-type { align-self: center; color: var(--muted); font: .66rem/1.25 ui-monospace, SFMono-Regular, Consolas, monospace; text-transform: uppercase; }
  .schema-details { margin-top: .82rem; }
  .schema-details summary { width: max-content; max-width: 100%; cursor: pointer; color: var(--accent-strong); font-size: .79rem; font-weight: 700; }
  .schema-details > .relation-list { margin-top: .72rem; }
  .schema-links { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .72rem; }
  .schema-links a { padding: .24rem .46rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font: .7rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; text-decoration: none; }
  .provenance-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; margin-top: 3rem; padding-top: 1.65rem; border-top: 1px solid var(--border); }
  .provenance-grid h3 { margin: 0 0 .42rem; font-family: inherit; font-size: .88rem; }
  .provenance-grid p { margin: 0; color: var(--muted); font-size: .81rem; line-height: 1.7; }
  .project-links { display: flex; flex-wrap: wrap; gap: .45rem .9rem; margin-top: .75rem; font-size: .8rem; }
  .landing a { color: var(--accent-strong); }
  .attribution { color: var(--muted); font-size: .84rem; border-top: 1px solid var(--border);
    margin-top: 2.6rem; padding-top: 1.15rem; max-width: 52rem; line-height: 1.72; }
  .noscript { max-width: 44rem; margin: 2rem auto; padding: 1.2rem; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cards a, .global-search button, .global-search button::after { transition: none; }
  }
  @media (prefers-contrast: more) {
    :root, :root[data-theme="dark"] { --border: #72807c; --rule: transparent; }
    :root[data-theme="light"] { --border: #5f6b67; }
    #items a.active, .cards a:hover, .relation-link:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  }
  @media (max-width: 1180px) and (min-width: 981px) {
    nav { width: 204px; }
    #list { width: 316px; }
    #detail { padding-right: 2rem; padding-left: 2rem; }
  }
  @media (max-width: 980px) {
    header { min-height: 68px; padding: .72rem .95rem .85rem; grid-template-columns: minmax(0, 1fr) auto; gap: .7rem .9rem; }
    .global-search { grid-column: 1 / -1; grid-row: 2; }
    .header-meta { display: none; }
    #layout { width: 100%; min-width: 0; flex-direction: column; }
    nav { width: 100%; min-width: 0; display: flex; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid rgba(0,0,0,.16); padding: .5rem .55rem; }
    nav .navhead { display: none; }
    nav a { flex: none; min-height: 38px; padding: .42rem .68rem; white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; }
    nav a.active { border-left: 0; border-bottom-color: var(--nav-accent); }
    #list { width: 100%; min-width: 0; max-height: 36vh; border-right: none; border-bottom: 1px solid var(--border); }
    #filterwrap { padding-top: .8rem; }
    #detail { width: 100%; min-width: 0; overflow-x: hidden; padding: 2.5rem clamp(1.15rem, 5vw, 2.5rem) 4rem; }
  }
  @media (max-width: 640px) {
    header .tag { max-width: 16rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .theme-toggle { width: 44px; padding: 0; justify-content: center; }
    .theme-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .global-search button { min-width: 94px; padding-right: .75rem; padding-left: .75rem; }
    #list { max-height: 34vh; }
    #detail { padding-top: 2rem; }
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards a { min-height: 92px; padding: .85rem .9rem .92rem; }
    .landing h2 { font-size: clamp(2.05rem, 10vw, 2.65rem); }
    .record h2 { font-size: clamp(2rem, 9vw, 2.5rem); }
    .resource-grid, .provenance-grid { grid-template-columns: 1fr; }
    .section-heading { display: block; }
    .section-heading p { margin-top: .25rem; text-align: left; }
    .record-heading { display: block; }
    .entity-type { display: inline-block; margin: .15rem 0 .65rem; }
  }
  @media (max-width: 440px) {
    header { padding-right: .75rem; padding-left: .75rem; }
    header h1 { font-size: .95rem; }
    header .tag { max-width: 14.5rem; font-size: .71rem; }
    #detail { padding-right: 1rem; padding-left: 1rem; }
    .landing::before { font-size: .68rem; }
    .landing .lede { font-size: 1.02rem; line-height: 1.72; }
    .cards, .facts { grid-template-columns: 1fr; }
    .cards a { min-height: 84px; }
    .resource-link { gap: .5rem; }
    .resource-type { font-size: .62rem; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#detail">Skip to record</a>
<header>
  <div class="brand">
    <div class="brand-copy">
      <h1><a href="#/">Blades in the Dark SRD</a></h1>
      <span class="tag">Searchable Forged in the Dark rules for people and machines</span>
    </div>
  </div>
  <form class="global-search" id="global-search-form" role="search">
    <label class="visually-hidden" for="global-search">Search the full corpus</label>
    <svg class="search-icon global-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="10.75" cy="10.75" r="6.25"></circle>
      <path d="m15.5 15.5 4.25 4.25"></path>
    </svg>
    <input id="global-search" type="search" placeholder="Search abilities, claims, rules…" autocomplete="off" />
    <button type="submit"><span>Search</span></button>
  </form>
  <div class="header-actions">
    <span class="header-meta">Open data · CC BY 3.0</span>
    <a class="header-repo" href="https://github.com/klrkdekira/fitd-system-json" target="_blank" rel="noopener noreferrer" aria-label="Project repository on GitHub">GitHub</a>
    <button class="theme-toggle" id="theme-toggle" type="button">
      <span class="theme-icon" aria-hidden="true">☀</span>
      <span class="theme-label">Light</span>
    </button>
  </div>
</header>
<div id="layout">
  <nav id="nav" aria-label="Collections"></nav>
  <div id="list">
    <div id="filterwrap">
      <svg class="search-icon filter-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="10.75" cy="10.75" r="6.25"></circle>
        <path d="m15.5 15.5 4.25 4.25"></path>
      </svg>
      <input id="filter" type="search" placeholder="Filter…" aria-label="Filter current collection" autocomplete="off" />
    </div>
    <div id="filterhint">Filter this collection by name or summary</div>
    <div id="items"></div>
  </div>
  <main id="detail" tabindex="-1">
    <noscript>
      <section class="noscript">
        <h2>Blades in the Dark SRD System JSON</h2>
        <p>JavaScript is required for the interactive explorer. The corpus remains available as static files:</p>
        <p><a href="objects/fitd-system-data.bundle.jsonld">JSON-LD bundle</a> · <a href="llms-full.txt">full text context</a> · <a href="SPECIFICATION.md">technical specification</a></p>
      </section>
    </noscript>
  </main>
</div>
<script>
(function () {
  "use strict";
  var LABELS = {
    actions: "Actions", "special-abilities": "Special Abilities",
    entanglements: "Entanglements", "downtime-activities": "Downtime Activities",
    claims: "Claims", "trauma-conditions": "Trauma Conditions",
    vices: "Vices", plans: "Plans", "teamwork-maneuvers": "Teamwork Maneuvers",
    rules: "Rules", tables: "Tables", sources: "Sources"
  };
  var NAV_ORDER = ["actions", "special-abilities", "entanglements",
    "downtime-activities", "claims", "trauma-conditions",
    "vices", "plans", "teamwork-maneuvers",
    "rules", "tables", "sources"];
  var colIndex = null, searchIndex = null, searchIndexPromise = null;
  var route = { collection: null, slug: null, search: null };

  var nav = document.getElementById("nav");
  var items = document.getElementById("items");
  var detail = document.getElementById("detail");
  var filter = document.getElementById("filter");
  var globalSearchForm = document.getElementById("global-search-form");
  var globalSearch = document.getElementById("global-search");
  var themeToggle = document.getElementById("theme-toggle");
  var themeColor = document.querySelector('meta[name="theme-color"]');

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || "dark";
  }

  function updateThemeToggle() {
    var activeTheme = currentTheme();
    var nextTheme = activeTheme === "dark" ? "light" : "dark";
    themeColor.setAttribute("content", activeTheme === "dark" ? "#0c0f0f" : "#e5dfd2");
    themeToggle.setAttribute("aria-label", "Use " + nextTheme + " theme");
    themeToggle.setAttribute("title", "Use " + nextTheme + " theme");
    themeToggle.querySelector(".theme-icon").textContent = nextTheme === "light" ? "☀" : "☾";
    themeToggle.querySelector(".theme-label").textContent = nextTheme === "light" ? "Light" : "Dark";
  }

  themeToggle.addEventListener("click", function () {
    var nextTheme = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nextTheme);
    try { localStorage.setItem("fitd-theme", nextTheme); } catch (error) { /* optional */ }
    updateThemeToggle();
  });
  updateThemeToggle();

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function link(href, cls) {
    var a = document.createElement("a");
    a.href = href; if (cls) a.className = cls;
    return a;
  }

  fetch("objects/collection-index.json")
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (data) {
      colIndex = data.collections;
      window.addEventListener("hashchange", onRoute);
      onRoute();
    })
    .catch(function () {
      detail.textContent = "";
      var box = el("section", "noscript");
      box.appendChild(el("h2", null, "Explorer unavailable"));
      box.appendChild(el("p", "placeholder",
        "Could not load objects/collection-index.json. The corpus is still available as static files:"));
      var links = el("p", "placeholder");
      var bundleLink = link("objects/fitd-system-data.bundle.jsonld");
      bundleLink.textContent = "JSON-LD bundle";
      links.appendChild(bundleLink);
      links.appendChild(document.createTextNode(" · "));
      var llmsLink = link("llms-full.txt");
      llmsLink.textContent = "full text context";
      links.appendChild(llmsLink);
      box.appendChild(links);
      detail.appendChild(box);
    });

  function onRoute() {
    var hash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var parts = hash.split("/").filter(Boolean);
    if (parts[0] === "search") {
      route = { collection: null, slug: null, search: parts.slice(1).join("/") };
      globalSearch.value = route.search;
      filter.value = "";
      renderNav();
      runGlobalSearch(route.search);
      return;
    }
    route = { collection: parts[0] || null, slug: parts[1] || null, search: null };
    globalSearch.value = "";
    renderNav();
    if (!route.collection || !colIndex[route.collection]) {
      route.collection = null;
      renderList(null);
      renderLanding();
      return;
    }
    renderList(route.collection);
    if (route.slug) {
      showRecord(route.collection, route.slug);
    } else {
      renderCollectionIntro(route.collection);
    }
  }

  function renderNav() {
    nav.textContent = "";
    nav.appendChild(el("div", "navhead", "Browse"));
    NAV_ORDER.forEach(function (name) {
      if (!colIndex[name]) return;
      var a = link("#/" + name, route.collection === name ? "active" : "");
      if (route.collection === name) a.setAttribute("aria-current", "page");
      a.appendChild(el("span", null, LABELS[name] || name));
      a.appendChild(el("span", "count", String(colIndex[name].length)));
      nav.appendChild(a);
    });
  }

  // ---- list pane -----------------------------------------------------

  function renderList(collection, filterText) {
    document.getElementById("list").classList.toggle("is-idle", !collection);
    document.getElementById("list").classList.remove("is-searching");
    items.textContent = "";
    if (!collection) {
      filter.placeholder = "Search the full corpus…";
      items.appendChild(el("p", "placeholder", "Pick a collection above, or press Enter in the box to search everything."));
      return;
    }
    filter.placeholder = "Filter " + (LABELS[collection] || collection).toLowerCase() + "…";
    var needle = (filterText || "").toLowerCase();
    var lastGroup = null, shown = 0, activeItem = null;
    colIndex[collection].forEach(function (entry) {
      if (needle &&
          entry.name.toLowerCase().indexOf(needle) === -1 &&
          entry.sub.toLowerCase().indexOf(needle) === -1 &&
          (entry.group || "").toLowerCase().indexOf(needle) === -1) return;
      if (entry.group !== lastGroup) {
        items.appendChild(el("div", "group", entry.group));
        lastGroup = entry.group;
      }
      var a = link("#/" + collection + "/" + entry.slug,
        route.slug === entry.slug ? "active" : "");
      if (route.slug === entry.slug) {
        a.setAttribute("aria-current", "page");
        activeItem = a;
      }
      var name = el("span", "nm");
      appendInlineMarkdown(name, entry.name);
      a.appendChild(name);
      if (entry.sub) {
        var summary = el("span", "sub");
        appendInlineMarkdown(summary, inlineSummary(entry.sub));
        a.appendChild(summary);
      }
      items.appendChild(a);
      shown += 1;
    });
    if (!shown) items.appendChild(el("p", "placeholder", "No matches in this collection. Press Enter to search everything."));
    if (activeItem) activeItem.scrollIntoView({ block: "center" });
  }

  var filterTimer = null;
  filter.addEventListener("input", function () {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(function () {
      if (route.collection) renderList(route.collection, filter.value.trim());
    }, 120);
  });
  globalSearchForm.addEventListener("submit", function (event) {
    event.preventDefault();
    var query = globalSearch.value.trim();
    if (query) location.hash = "#/search/" + encodeURIComponent(query);
  });

  function ensureSearchIndex() {
    if (!searchIndexPromise) {
      searchIndexPromise = fetch("objects/search-index.json")
        .then(function (r) { return r.json(); })
        .then(function (idx) { searchIndex = idx; return idx; });
    }
    return searchIndexPromise;
  }

  function runGlobalSearch(query) {
    document.getElementById("list").classList.remove("is-idle");
    document.getElementById("list").classList.add("is-searching");
    items.textContent = "";
    items.appendChild(el("p", "placeholder", "Searching…"));
    detail.textContent = "";
    detail.appendChild(el("p", "placeholder", "Full-text results for “" + query + "” are in the list."));
    var terms = query.toLowerCase().split(/\s+/).filter(function (t) { return t.length >= 3; });
    if (!terms.length) {
      items.textContent = "";
      items.appendChild(el("p", "placeholder", "Search terms need at least 3 characters."));
      return;
    }
    ensureSearchIndex().then(function (idx) {
      var hits = null;
      terms.forEach(function (term) {
        var matched = {};
        Object.keys(idx.tokens).forEach(function (token) {
          if (token.indexOf(term) === 0) {
            idx.tokens[token].forEach(function (posting) {
              matched[posting.document] = posting.excerpt;
            });
          }
        });
        hits = hits === null ? matched : intersect(hits, matched);
      });
      items.textContent = "";
      var allDocs = Object.keys(hits || {}).map(Number);
      var docs = allDocs.slice(0, 300);
      if (!docs.length) {
        items.appendChild(el("p", "placeholder", "No matches anywhere."));
        return;
      }
      var countLabel = allDocs.length > docs.length
        ? "First " + docs.length + " of " + allDocs.length + " results"
        : docs.length + " results";
      items.appendChild(el("div", "group", countLabel));
      docs.forEach(function (docIndex) {
        var doc = idx.documents[docIndex];
        var pathParts = doc.id.split("/"); // objects/<collection>/<slug>
        var a = link("#/" + pathParts[1] + "/" + pathParts[2]);
        var name = el("span", "nm");
        appendInlineMarkdown(name, doc.name);
        a.appendChild(name);
        var matchedExcerpt = (hits || {})[docIndex] || doc.excerpt;
        var summary = el("span", "sub");
        summary.appendChild(document.createTextNode(LABELS[pathParts[1]] || doc.type));
        if (matchedExcerpt) {
          summary.appendChild(document.createTextNode(" · "));
          appendInlineMarkdown(summary, inlineSummary(matchedExcerpt));
        }
        a.appendChild(summary);
        items.appendChild(a);
      });
    });
  }
  function intersect(a, b) {
    var out = {};
    Object.keys(a).forEach(function (k) { if (b[k]) out[k] = a[k] || b[k]; });
    return out;
  }

  // ---- detail pane ---------------------------------------------------

  function renderLanding() {
    detail.textContent = "";
    var box = el("div", "landing");
    var total = NAV_ORDER.reduce(function (sum, name) {
      return sum + (colIndex[name] ? colIndex[name].length : 0);
    }, 0);
    var browsable = total - (colIndex.sources ? colIndex.sources.length : 0);

    box.appendChild(el("h2", null, "The Blades in the Dark SRD, as connected data"));
    box.appendChild(el("p", "lede",
      "A browsable, machine-readable reference corpus built from the Creative Commons Blades in the Dark SRD. " +
      "Records preserve source wording alongside typed fields, graph links, and line-level provenance. " +
      "Browse a collection, filter its entries, or use the header search to search across the corpus."));

    var meta = el("div", "landing-meta");
    [total.toLocaleString() + " records", NAV_ORDER.length + " collections", "JSON-LD 1.1",
      "JSON Schema 2020-12", "v0.2.0"].forEach(function (label) {
      meta.appendChild(el("span", null, label));
    });
    box.appendChild(meta);

    var browseHeading = el("div", "section-heading");
    browseHeading.appendChild(el("h3", null, "Browse the corpus"));
    browseHeading.appendChild(el("p", null, browsable.toLocaleString() + " rules and game-reference records"));
    box.appendChild(browseHeading);
    var cards = el("div", "cards");
    NAV_ORDER.forEach(function (name) {
      if (!colIndex[name] || name === "sources") return;
      var a = link("#/" + name);
      a.appendChild(el("span", "n", String(colIndex[name].length)));
      a.appendChild(el("span", "l", LABELS[name]));
      cards.appendChild(a);
    });
    box.appendChild(cards);

    var dataHeading = el("div", "section-heading");
    dataHeading.appendChild(el("h3", null, "Use the data"));
    dataHeading.appendChild(el("p", null, "Download, integrate, validate, or cite the corpus"));
    box.appendChild(dataHeading);

    var resources = el("div", "resource-grid");
    appendResourceGroup(resources, "Corpus downloads", "Primary data artifacts for applications and offline use.", [
      ["objects/fitd-system-data.bundle.jsonld", "Self-contained bundle", "All records in one @graph", "JSON-LD"],
      ["objects/fitd-system-data.jsonld", "Aggregate manifest", "Collection membership, schemas, and corpus digest", "JSON-LD"],
      ["datapackage.json", "Frictionless Data Package", "Portable dataset metadata and resource listing", "JSON"],

  function recordSubtitle(record) {
    if (record["@type"] === "Action") {
      return record.attribute + " action";
    }
    if (record["@type"] === "SpecialAbility") {
      return (record.abilityScope === "crew" ? "Crew" : "Character") + " special ability";
    }
    if (record["@type"] === "Claim") {
      return (record.claimType === "prison" ? "Prison" : "Crew") + " claim";
    }
    // Types whose subtitle would only repeat the entity-type chip
    // (Entanglement, Vice, Plan, Table, …) render no subtitle at all.
    if (record["@type"] === "Rule") return (record.sourceLocator && record.sourceLocator.chapter) || "";
    if (record["@type"] === "Source") {
      return [record.author, record.publisher].filter(Boolean).join(" · ");
    }
    return "";
  }

  var FACT_FIELDS = [
    ["attribute", "Attribute"], ["abilityScope", "Scope"], ["claimType", "Claim Type"],
    ["detail", "Detail"],
    ["section", "Section"],
    ["author", "Author"], ["publisher", "Publisher"], ["sourceVersion", "Source Version"],
    ["license", "License"], ["sourceFile", "Source File"], ["contentDigest", "Content Digest"]
  ];
  function renderFacts(box, record) {
    var grid = el("div", "facts");
    var count = 0;
    function fact(label, value) {
      var node = el("div", "fact");
      node.appendChild(el("span", "k", label));
      node.appendChild(el("span", "v", value));
      grid.appendChild(node);
      count += 1;
    }
    FACT_FIELDS.forEach(function (pair) {
      if (record[pair[0]] !== undefined) fact(pair[1], displayValue(record[pair[0]]));
    });
    if (count) box.appendChild(grid);
  }

  function displayValue(value) {
    if (typeof value === "boolean") return value ? "Yes" : "No";
    if (Array.isArray(value)) return value.join(", ");
    return String(value);
  }

  function humanizeType(value) {
    return String(value).replace(/([a-z])([A-Z])/g, "$1 $2");
  }

  function renderRelations(box, record) {
    // relatedTables render inline with linked captions, not as relation chips.
    // relatedRules and seeAlso are declared in the JSON-LD context and vocab
    // but no current record carries them; they are supported here so future
    // corpus edges render without a UI change.
    var relationFields = [
      ["partOf", "Part of"],
      ["relatedRules", "Rule"],
      ["seeAlso", "See also"]
    ];
    var section = el("section", "structured-section");
    section.appendChild(el("h3", "structured-title", "Connected records"));
    var linkCount = 0;
    relationFields.forEach(function (pair) {
      if (!record[pair[0]]) return;
      var values = Array.isArray(record[pair[0]]) ? record[pair[0]] : [record[pair[0]]];
      var links = el("div", "relation-list");
      values.forEach(function (ref) {
        if (!ref || !ref["@id"]) return;
        var parts = ref["@id"].split("/objects/")[1];
        if (!parts) return;
        var routeParts = parts.split("/");
        if (routeParts.length < 2) return;
        var slug = routeParts.slice(1).join("/");
        var a = link("#/" + routeParts[0] + "/" + slug, "relation-link");
        var labelSlug = (routeParts[0] === "rules" || routeParts[0] === "tables")
          ? slug.replace(/^(\d+-)+/, "")
          : slug;
        a.textContent = pair[1] + " · " + titleFromSlug(labelSlug);
        links.appendChild(a);
        linkCount += 1;
      });
      if (links.childNodes.length) section.appendChild(links);
    });
    if (linkCount) box.appendChild(section);
  }

  function titleFromSlug(slug) {
    return slug.split("-").map(function (part) {
      return part ? part.charAt(0).toUpperCase() + part.slice(1) : part;
    }).join(" ");
  }

  var BLANK_CELL = { "": true, "-": true, "—": true, "―": true };
  function isBlankCell(value) {
    // Cells may carry placeholder dashes as raw entity references
    // (e.g. &#x2015; in the prison claims map), so compare decoded text.
    return BLANK_CELL[plainMarkdownText(value)] === true;
  }
  function plainMarkdownText(value) {
    return decodeEntities(String(value))
      .replace(/\\([\\`*{}\[\]()#+.!_>|-])/g, "$1")
      .replace(/[*_`]/g, "")
      .trim();
  }
  function isNumericValue(value) {
    var plain = plainMarkdownText(value);
    return /^[+-]?[\d,]+(?:\.\d+)?$/.test(plain) ||
      /^\d+d\d*(?:\s*[+-]\s*\d+)?$/.test(plain) ||
      /^[\d,\/ -]+ ?coin$/i.test(plain);
  }

  function numericColumns(columns, rows) {
    return columns.map(function (_, index) {
      var seen = false;
      var allNumeric = (rows || []).every(function (row) {
        var cell = row.cells[index];
        if (!cell || isBlankCell(cell.value)) return true;
        seen = true;
        return isNumericValue(cell.value);
      });
      return seen && allNumeric;
    });
  }

  function decodeEntities(value) {
    // Table cells keep raw source text, entity references included.
    if (!/&(?:#\d+|#x[0-9a-f]+|[a-z]+);/i.test(value)) return value;
    var doc = new DOMParser().parseFromString(value, "text/html");
    return doc.body.textContent;
  }

  function renderDataTable(box, columns, rows, caption, captionHref) {
    var wrap = el("div", "tablewrap");
    if ((rows || []).length > 14) wrap.className += " tall";
    if (caption) {
      var cap = el("div", "table-caption");
      if (captionHref) {
        var captionLink = link(captionHref);
        captionLink.textContent = caption;
        cap.appendChild(captionLink);
      } else {
        cap.appendChild(el("span", null, caption));
      }
      cap.appendChild(el("span", "rows-meta", (rows || []).length + " rows"));
      wrap.appendChild(cap);
    }
    var table = el("table", "data");
    var numeric = numericColumns(columns, rows);
    if (columns.some(function (c) { return c; })) {
      var thead = el("thead");
      var head = el("tr");
      columns.forEach(function (column, index) {
        var th = el("th", numeric[index] ? "num" : null);
        appendInlineMarkdown(th, column);
        head.appendChild(th);
      });
      thead.appendChild(head);
      table.appendChild(thead);
    }
    var tbody = el("tbody");
    (rows || []).forEach(function (row) {
      var tr = el("tr");
      row.cells.forEach(function (cell, index) {
        var cls = isBlankCell(cell.value) ? "blank" : (numeric[index] ? "num" : null);
        var td = el("td", cls);
        appendInlineMarkdown(td, cell.value);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    box.appendChild(wrap);
  }

  function parsePipeTable(tableLines) {
    var split = function (line) {
      var content = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      var cells = [], cell = "";
      for (var index = 0; index < content.length; index += 1) {
        var character = content.charAt(index);
        if (character === "|" && (index === 0 || content.charAt(index - 1) !== "\\")) {
          cells.push(cell.trim());
          cell = "";
        } else {
          cell += character;
        }
      }
      cells.push(cell.trim());
      return cells;
    };
    var first = split(tableLines[0]);
    var hasHeader = tableLines.length > 1 && split(tableLines[1]).every(function (c) {
      return /^:?-{2,}:?$/.test(c);
    });
    var columns = hasHeader ? first.map(function (value) {
      return value === "[]()" ? "" : value;
    }) : first.map(function () { return ""; });
    var dataLines = hasHeader ? tableLines.slice(2) : tableLines;
    var rows = [];
    dataLines.forEach(function (line) {
      var cells = split(line);
      rows.push({ cells: cells.map(function (value) { return { value: value }; }) });
    });
    return { columns: columns, rows: rows };
  }

  function delimiterRun(text, index, character) {
    var length = 0;
    while (text.charAt(index + length) === character) length += 1;
    return length;
  }

  function findClosingDelimiter(text, start, character, length) {
    var index = start + length;
    while (index < text.length) {
      if (text.charAt(index) !== character) {
        index += 1;
        continue;
      }
      var run = delimiterRun(text, index, character);
      if (run === length) return index;
      index += run;
    }
    return -1;
  }

  function appendInlineRange(parent, text) {
    var index = 0;
    var pending = "";
    var flushText = function () {
      if (pending) parent.appendChild(document.createTextNode(pending));
      pending = "";
    };
    while (index < text.length) {
      var character = text.charAt(index);
      if (character === "\\" && index + 1 < text.length) {
        pending += text.charAt(index + 1);
        index += 2;
        continue;
      }
      if (character === "`") {
        var codeEnd = text.indexOf("`", index + 1);
        if (codeEnd !== -1) {
          flushText();
          parent.appendChild(el("code", null, text.slice(index + 1, codeEnd)));
          index = codeEnd + 1;
          continue;
        }
      }
      if (character === "[") {
        var linkMatch = /^\[([^\]]+)\]\(([^)]+)\)/.exec(text.slice(index));
        if (linkMatch && /^(?:https?:|#|\/)/i.test(linkMatch[2])) {
          flushText();
          var anchor = link(linkMatch[2]);
          appendInlineRange(anchor, linkMatch[1]);
          if (/^https?:/i.test(linkMatch[2])) {
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
          }
          parent.appendChild(anchor);
          index += linkMatch[0].length;
          continue;
        }
      }
      if (character === "*") {
        var run = Math.min(delimiterRun(text, index, "*"), 3);
        var close = findClosingDelimiter(text, index, "*", run);
        if (close !== -1 && close > index + run) {
          flushText();
          var emphasis;
          if (run === 3) {
            emphasis = el("strong");
            var italic = el("em");
            appendInlineRange(italic, text.slice(index + run, close));
            emphasis.appendChild(italic);
          } else {
            emphasis = el(run === 2 ? "strong" : "em");
            appendInlineRange(emphasis, text.slice(index + run, close));
          }
          parent.appendChild(emphasis);
          index = close + run;
          continue;
        }
      }
      pending += character;
      index += 1;
    }
    flushText();
  }

  function appendInlineMarkdown(parent, value) {
    appendInlineRange(parent, decodeEntities(String(value)));
  }

  function inlineSummary(value) {
    var summary = String(value)
      .replace(/\s*\n+\s*[*+-]\s+/g, " · ")
      .replace(/\s+/g, " ")
      .trim();
    var strongMarkers = summary.match(/\*\*/g) || [];
    if (strongMarkers.length % 2) {
      summary = /\*\*\s*$/.test(summary)
        ? summary.replace(/\*\*\s*$/, "")
        : summary + "**";
    }
    return summary;
  }

  function listLine(line) {
    var match = /^(\s*)([*+-]|\d+[.)])\s+(.*)$/.exec(line);
    if (!match) return null;
    return {
      indent: match[1].replace(/\t/g, "    ").length,
      ordered: /^\d/.test(match[2]),
      start: parseInt(match[2], 10) || 1,
      text: match[3]
    };
  }

  function appendList(lines, start, parent) {
    var first = listLine(lines[start]);
    var root = el(first.ordered ? "ol" : "ul");
    if (first.ordered && first.start !== 1) root.start = first.start;
    parent.appendChild(root);
    var stack = [{ indent: first.indent, ordered: first.ordered, node: root, item: null }];
    var index = start;
    while (index < lines.length) {
      var info = listLine(lines[index]);
      if (!info) break;
      while (stack.length > 1 && info.indent < stack[stack.length - 1].indent) stack.pop();
      var level = stack[stack.length - 1];
      if (info.indent > level.indent) {
        if (!level.item) break;
        var nested = el(info.ordered ? "ol" : "ul");
        if (info.ordered && info.start !== 1) nested.start = info.start;
        level.item.appendChild(nested);
        level = { indent: info.indent, ordered: info.ordered, node: nested, item: null };
        stack.push(level);
      } else if (info.indent !== level.indent || info.ordered !== level.ordered) {
        break;
      }
      var item = el("li");
      appendInlineMarkdown(item, info.text);
      level.node.appendChild(item);
      level.item = item;
      index += 1;
    }
    return index;
  }

  function appendMarkdownBlocks(parent, lines) {
    var index = 0;
    while (index < lines.length) {
      if (!lines[index].trim()) {
        index += 1;
        continue;
      }
      if (/^\s*---\s*$/.test(lines[index])) {
        parent.appendChild(el("hr"));
        index += 1;
        continue;
      }
      if (/^>/.test(lines[index])) {
        var quoteLines = [];
        while (index < lines.length && /^>/.test(lines[index])) {
          quoteLines.push(lines[index].replace(/^> ?/, ""));
          index += 1;
        }
        var blockquote = el("blockquote");
        appendMarkdownBlocks(blockquote, quoteLines);
        parent.appendChild(blockquote);
        continue;
      }
      if (listLine(lines[index])) {
        index = appendList(lines, index, parent);
        continue;
      }
      var paragraphLines = [];
      while (
        index < lines.length && lines[index].trim() &&
        !/^>/.test(lines[index]) && !/^\s*---\s*$/.test(lines[index]) &&
        !listLine(lines[index])
      ) {
        paragraphLines.push(lines[index].trim());
        index += 1;
      }
      var paragraph = el("p");
      appendInlineMarkdown(paragraph, paragraphLines.join(" "));
      parent.appendChild(paragraph);
    }
  }

  function normalizedKey(text) {
    return text.toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function tableDropKeys(refs) {
    // Normalized names of related tables, derived from their slugs, so a
    // dangling caption line in prose can be suppressed (the inline table
    // render carries the caption instead).
    var keys = {};
    (refs || []).forEach(function (ref) {
      var parts = ref && ref["@id"] ? ref["@id"].split("/objects/tables/")[1] : null;
      if (parts) keys[normalizedKey(parts.replace(/^(\d+-)+/, ""))] = true;
    });
    return keys;
  }

  function isCaptionLine(line) {
    return line && line.length < 80 && !/[.:,;]$/.test(line);
  }

  function renderProse(box, text, dropKeys) {
    // Render the source Markdown with DOM nodes (never innerHTML), promoting
    // embedded pipe tables to real tables. A short caption line directly
    // above an embedded table becomes its caption.
    if (!text) return;
    var lines = text.split("\n");
    var buffer = [];
    var flush = function () {
      var chunk = buffer.join("\n").replace(/\n{3,}/g, "\n\n").trim();
      if (chunk && chunk !== "---") {
        var prose = el("div", "prose");
        appendMarkdownBlocks(prose, chunk.split("\n"));
        if (prose.childNodes.length) box.appendChild(prose);
      }
      buffer = [];
    };
    var index = 0;
    var isPipeLine = function (line) {
      var trimmed = line.trim();
      return trimmed.charAt(0) === "|" && trimmed.charAt(trimmed.length - 1) === "|" && trimmed.length > 2;
    };
    while (index < lines.length) {
      var trimmedLine = lines[index].trim();
      if (isPipeLine(lines[index])) {
        var tableLines = [];
        while (index < lines.length && isPipeLine(lines[index])) {
          tableLines.push(lines[index].trim());
          index += 1;
        }
        // Pop a caption line sitting as its own paragraph right above.
        var caption = null;
        var tail = buffer.length - 1;
        while (tail >= 0 && !buffer[tail].trim()) tail -= 1;
        var isOwnParagraph = tail === 0 || (tail > 0 && !buffer[tail - 1].trim());
        if (tail >= 0 && isOwnParagraph && isCaptionLine(buffer[tail].trim())) {
          caption = buffer[tail].trim();
          buffer = buffer.slice(0, tail);
        }
        flush();
        var parsed = parsePipeTable(tableLines);
        renderDataTable(box, parsed.columns, parsed.rows, caption);
      } else if (
        dropKeys && trimmedLine && isCaptionLine(trimmedLine) &&
        dropKeys[normalizedKey(trimmedLine)] &&
        (buffer.length === 0 || !buffer[buffer.length - 1].trim()) &&
        (index + 1 >= lines.length || !lines[index + 1].trim())
      ) {
        index += 1; // suppress the dangling caption of an inline related table
      } else {
        buffer.push(lines[index]);
        index += 1;
      }
    }
    flush();
  }

  function renderRelatedTables(box, refs) {
    // Fetch each referenced Table record and render it inline where it is
    // cited; fall back to a navigation link if the fetch fails.
    (refs || []).forEach(function (ref) {
      if (!ref || !ref["@id"]) return;
      var parts = ref["@id"].split("/objects/")[1];
      if (!parts) return;
      var holder = el("div", "inline-table");
      box.appendChild(holder);
      fetch("objects/" + parts + ".jsonld").then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }).then(function (table) {
        if (!table.columns) return;
        renderDataTable(holder, table.columns, table.rows, table.name, "#/" + parts);
      }).catch(function () {
        var a = link("#/" + parts, "relation-link");
        a.textContent = "Table · " + titleFromSlug(parts.split("/")[1] || parts);
        holder.appendChild(a);
      });
    });
  }
})();
</script>
</body>
</html>
